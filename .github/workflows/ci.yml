name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run the test suite
        run: npm test

      - name: Verify the dev server serves the app
        if: runner.os == 'Linux'
        run: |
          node server.mjs &
          sleep 1
          curl --fail --silent --show-error http://localhost:3000/ > /dev/null
          curl --fail --silent --show-error http://localhost:3000/src/main.js > /dev/null
          curl --fail --silent --show-error http://localhost:3000/assets/css/main.css > /dev/null

  static-analysis:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check every module
        run: |
          for f in $(find src test server.mjs -name '*.js' -o -name '*.mjs'); do
            node --check "$f"
          done

      - name: Zero-dependency guarantee
        run: |
          if [ -n "$(ls node_modules 2>/dev/null)" ]; then
            echo "node_modules must stay empty — zero runtime dependencies is a design guarantee"
            exit 1
          fi
          node -e "const p=require('./package.json'); if (Object.keys(p.dependencies||{}).length || Object.keys(p.devDependencies||{}).length) { console.error('package.json must declare no dependencies'); process.exit(1) }"
